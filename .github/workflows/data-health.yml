name: Data health check

# 앱이 쓰는 지표 11개가 Yahoo에서 제때 들어오는지 매일 두 번 점검한다.
#  - 평일 07:20 KST (미국 장 마감 후, 아침 알림 08:40 전)
#  - 평일 16:30 KST (코스피 마감 후)
# 문제가 있으면 5분 간격으로 3번까지 다시 보고, 그래도 안 되면 실패 → GitHub가 저장소 주인에게 메일로 알린다.
on:
  schedule:
    - cron: '20 22 * * 0-4'
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/health-check.js'
      - 'www/js/series.js'
      - 'www/js/freshness.js'
      - '.github/workflows/data-health.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Yahoo data with the app's own code
        run: node tools/health-check.js
      - name: Keep result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-${{ github.run_number }}
          path: health.json
          retention-days: 30

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>엄마의 시장 나침반</title>
<link rel="icon" href="img/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar" id="topbar">
    <button type="button" class="tbtn back" id="backBtn" data-act="back" hidden aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>뒤로
    </button>
    <h1 id="title">오늘</h1>
    <div id="topActions"></div>
  </header>
  <div class="strip" id="strip" aria-live="polite"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="아래 메뉴">
    <button type="button" class="tab" data-act="tab" data-tab="today">
      <span class="ico"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="14" cy="14" r="5"/><path d="M14 3v3M14 22v3M3 14h3M22 14h3M6.2 6.2l2.1 2.1M19.7 19.7l2.1 2.1M6.2 21.8l2.1-2.1M19.7 8.3l2.1-2.1"/></svg></span>오늘</button>
    <button type="button" class="tab" data-act="tab" data-tab="holdings">
      <span class="ico"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="7" width="21" height="15" rx="3"/><path d="M3.5 11h16M18 15.5h3.5"/><path d="M7 7l9-3.5 2 3.5"/></svg></span>내 종목</button>
    <button type="button" class="tab" data-act="tab" data-tab="record">
      <span class="ico"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3.5h10l5 5v16H7z"/><path d="M10.5 16l3 3 5.5-6"/></svg></span>성적표</button>
    <button type="button" class="tab" data-act="tab" data-tab="more">
      <span class="ico"><svg viewBox="0 0 28 28" fill="currentColor" aria-hidden="true"><circle cx="6.5" cy="14" r="2.4"/><circle cx="14" cy="14" r="2.4"/><circle cx="21.5" cy="14" r="2.4"/></svg></span>더보기</button>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="onboarding" hidden></div>

<script src="vendor/capacitor.js"></script>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/reading.js"></script>
<script src="js/overnight.js"></script>
<script src="js/context.js"></script>
<script src="js/holdings.js"></script>
<script src="js/content.js"></script>
<script src="js/compute.js"></script>
<script src="js/store.js"></script>
<script src="js/native.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
